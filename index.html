<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass compatibility finder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5f8f5c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --cream:#f4efe6;
    --cream-2:#ffffff;
    --line:#e4dccd;
    --ink:#231f1a;
    --ink-soft:#6f6a5f;
    --green:#5f8f5c;
    --green-dark:#476b45;
    --green-tint:#e8f0e4;
    --clay:#c96f4a;
    --clay-tint:#f7e4da;
    --danger:#c65b5b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    padding:2.5rem 1.25rem 4rem;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header{
    background:var(--cream-2);
    border:1px solid var(--line);
    border-radius:20px;
    padding:2rem 1.75rem;
    margin-bottom:1.75rem;
    position:relative;
    overflow:hidden;
  }
  .hero-glow{
    position:absolute;
    top:-50px;
    right:-50px;
    width:180px;
    height:180px;
    background:var(--green-tint);
    border-radius:50%;
    pointer-events:none;
  }
  .hero-shard{
    position:absolute;
    top:18px;
    right:26px;
    width:68px;
    height:68px;
    opacity:0.85;
  }
  .eyebrow{
    display:inline-block;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:700;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--green-dark);
    background:var(--green-tint);
    padding:5px 14px;
    border-radius:999px;
    margin:0 0 16px;
    position:relative;
    z-index:1;
  }
  h1{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:700;
    font-weight:800;
    font-size:34px;
    margin:0 0 10px;
    color:var(--ink);
    letter-spacing:-0.01em;
    line-height:1.05;
    position:relative;
    z-index:1;
    max-width:82%;
  }
  .sub{color:var(--ink-soft);font-size:14px;margin:0;line-height:1.5;position:relative;z-index:1;max-width:82%;}

  .search-label{
    display:block;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:700;
    font-weight:700;
    font-size:13px;
    color:var(--ink);
    margin-bottom:8px;
  }
  .search-box{position:relative;margin-bottom:0.75rem;}
  .search-box input{
    width:100%;
    background:var(--cream-2);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:15px 22px;
    font-size:16px;
    font-weight:500;
    color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    outline:none;
  }
  .search-box input:focus{border-color:var(--green);}
  .search-box input::placeholder{color:#a89f8e;font-weight:400;}

  .search-hint{font-size:12px;color:var(--ink-soft);margin:10px 0 1.5rem 4px;}

  .results{margin-bottom:2.5rem;min-height:20px;}

  .answer-card{
    position:relative;
    background:var(--green);
    border-radius:18px;
    padding:1.25rem 1.5rem;
    margin-bottom:14px;
  }
  .answer-card .spark{
    position:absolute;
    top:14px;
    right:16px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:700;
    font-size:11px;
    font-weight:700;
    background:rgba(255,255,255,0.25);
    color:#fff;
    padding:4px 11px;
    border-radius:999px;
  }
  .answer-label{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:700;
    font-size:12px;
    font-weight:700;
    color:#eaf3e8;
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin:0 0 6px;
  }
  .answer-main{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:700;
    font-size:24px;
    font-weight:800;
    color:#fff;
    margin:0;
    line-height:1.3;
  }
  .answer-main b{color:#fff2c9;}

  .result-card{
    background:var(--cream-2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:1.1rem 1.25rem;
    margin-bottom:12px;
  }
  .result-card .match-label{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:700;
    font-size:12px;
    font-weight:700;
    color:var(--clay);
    margin:0 0 10px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    background:var(--clay-tint);
    color:#8a4325;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:13px;
    font-weight:600;
    padding:6px 13px;
    border-radius:999px;
  }
  .chip.self{
    background:var(--green);
    color:#fff;
    font-weight:700;
  }
  .glass-meta{margin-top:10px;font-size:13px;color:var(--ink-soft);}
  .empty-state{color:var(--ink-soft);font-size:14px;padding:1.5rem 0;text-align:center;}
  .no-match{
    color:var(--ink);
    font-size:14px;
    font-weight:500;
    padding:1rem 1.25rem;
    background:var(--cream-2);
    border:1.5px dashed var(--line);
    border-radius:16px;
  }

  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    padding-top:1.75rem;
    border-top:1px solid var(--line);
  }
  .section-head h2{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:700;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    margin:0;
  }
  button{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--cream-2);
    color:var(--ink);
    padding:8px 16px;
  }
  button:hover{background:var(--cream);}
  .btn-accent{
    background:var(--green);
    color:#fff;
    border-color:var(--green);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:700;
    font-weight:700;
  }
  .btn-accent:hover{background:var(--green-dark);}

  .group-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .group-row:last-child{border-bottom:none;}
  .group-models{font-size:13px;color:var(--ink);line-height:1.6;}
  .group-models b{font-weight:700;}
  .group-base{
    display:inline-block;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:700;
    font-size:11px;
    font-weight:700;
    color:#fff;
    background:var(--clay);
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:6px;
  }
  .group-glass{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .row-actions{display:flex;gap:6px;flex-shrink:0;}
  .row-actions button{padding:6px 12px;font-size:12px;}

  .form-panel{
    background:var(--cream-2);
    border:1px solid var(--line);
    border-radius:18px;
    padding:1.25rem;
    margin-top:14px;
  }
  .form-panel label{
    display:block;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:700;
    font-size:12px;
    font-weight:700;
    color:var(--green-dark);
    margin:0 0 6px;
  }
  .form-panel textarea, .form-panel input[type=text]{
    width:100%;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:14px;
    outline:none;
    margin-bottom:14px;
    resize:vertical;
  }
  .form-panel textarea:focus, .form-panel input[type=text]:focus{border-color:var(--green);}
  .form-hint{font-size:11px;color:var(--ink-soft);margin:-10px 0 14px;}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;}

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    opacity:0;
    transition:opacity 0.25s;
    pointer-events:none;
  }
  .toast.show{opacity:1;}

</style>
</head>
<body>
<div class="wrap" id="mainApp">
  <header>
    <div class="hero-glow"></div>
    <svg class="hero-shard" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,5 90,35 75,90 25,90 10,35" fill="none" stroke="#e0c3ff" stroke-width="2" opacity="0.55"/>
      <polygon points="50,5 65,45 50,60 35,45" fill="#a855f7" opacity="0.35"/>
      <line x1="50" y1="5" x2="50" y2="60" stroke="#f3e8ff" stroke-width="1" opacity="0.5"/>
      <line x1="10" y1="35" x2="50" y2="60" stroke="#f3e8ff" stroke-width="1" opacity="0.4"/>
      <line x1="90" y1="35" x2="50" y2="60" stroke="#f3e8ff" stroke-width="1" opacity="0.4"/>
      <circle cx="50" cy="30" r="3" fill="#fff2a8"/>
    </svg>
    <span class="eyebrow">Shop tool</span>
    <h1>Glass compatibility finder</h1>
    <p class="sub">Type a phone model — get told exactly which glass to grab.</p>
  </header>

  <label class="search-label" for="searchInput">Search a glass model</label>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="e.g. A77, Narzo 10, iPhone 12..." autocomplete="off">
  </div>
  <p class="search-hint">Type the exact model code (e.g. A77, Y76 5G) — at least 2 characters. This avoids mixing up similar codes across brands.</p>

  <div class="results" id="results"></div>

  <div class="section-head">
    <h2>All compatibility groups (<span id="groupCount">0</span>)</h2>
<button class="btn-accent" id="addBtn">+ Add group</button>
  </div>
  <div id="groupList"></div>
  <div id="formPanel"></div>
</div>

<div class="toast" id="toast"></div>

function loadGroups(){
  try{
    const raw = localStorage.getItem('glass-groups');
    groups = raw ? JSON.parse(raw) : SEED_GROUPS.slice();
  }catch(e){
    groups = SEED_GROUPS.slice();
  }
  SEED_GROUPS.forEach(seed => {
    const idx = groups.findIndex(g => g.id === seed.id);
    if(idx >= 0) groups[idx] = seed; else groups.push(seed);
  });
  groups.forEach(g => { if(!g.baseModel) g.baseModel = g.models[0]; });
  saveGroups();
  renderGroupList();
  renderResults();
}

function saveGroups(){
  try{
    localStorage.setItem('glass-groups', JSON.stringify(groups));
  }catch(e){
    toast('Could not save — try again');
  }
}

function normalize(s){
  return s.trim().toLowerCase().replace(/\s+/g,' ');
}

function modelMatchesQuery(model, q){
  const nm = normalize(model);
  if(nm === q) return true;
  return nm.split(' ').indexOf(q) !== -1;
}

function renderResults(){
  const q = normalize(document.getElementById('searchInput').value);
  const box = document.getElementById('results');
  if(q.length < 2){
    box.innerHTML = '';
    return;
  }
  const matches = groups.filter(g =>
    g.models.some(m => modelMatchesQuery(m, q))
  );
  if(matches.length === 0){
    box.innerHTML = '<div class="no-match">No compatibility group found for that exact model code yet. Add one below.</div>';
    return;
  }
  box.innerHTML = matches.map(g => {
    const chips = g.models.map(m => {
      const isSelf = modelMatchesQuery(m, q);
      return '<span class="chip ' + (isSelf ? 'self' : '') + '">' + escapeHtml(m) + '</span>';
    }).join('');
    const meta = (g.glassType || g.notes)
      ? '<div class="glass-meta">' + [g.glassType, g.notes].filter(Boolean).map(escapeHtml).join(' — ') + '</div>'
      : '';
    return '<div class="answer-card"><span class="spark">match!</span>' +
      '<p class="answer-label">Take this glass</p>' +
      '<p class="answer-main">Use <b>' + escapeHtml(g.baseModel) + '</b> glass</p></div>' +
      '<div class="result-card"><p class="match-label">All models this glass fits</p><div class="chips">' + chips + '</div>' + meta + '</div>';
  }).join('');
}

function renderGroupList(){
  document.getElementById('groupCount').textContent = groups.length;
  const list = document.getElementById('groupList');
  if(groups.length === 0){
    list.innerHTML = '<div class="empty-state">No groups yet. Add your first compatibility group.</div>';
    return;
  }
  list.innerHTML = groups.map(g => {
    const modelsStr = g.models.map(escapeHtml).join(', ');
    const glassStr = (g.glassType || g.notes)
      ? '<div class="group-glass">' + [g.glassType, g.notes].filter(Boolean).map(escapeHtml).join(' — ') + '</div>'
      : '';
    return '<div class="group-row">' +
      '<div><span class="group-base">Stock: ' + escapeHtml(g.baseModel) + '</span><div class="group-models"><b>' + modelsStr + '</b></div>' + glassStr + '</div>' +
      '<div class="row-actions">' +
        '<button onclick="startEdit(\'' + g.id + '\')">Edit</button>' +
        '<button onclick="deleteGroup(\'' + g.id + '\')">Delete</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function showForm(existing){
  editingId = existing ? existing.id : null;
  const panel = document.getElementById('formPanel');
  panel.innerHTML =
    '<div class="form-panel">' +
      '<label>Phone models that share this glass (comma separated)</label>' +
      '<textarea id="modelsInput" rows="2" placeholder="Samsung A14, Samsung A14 5G, Samsung A13">' + (existing ? existing.models.join(', ') : '') + '</textarea>' +
      '<label>Which model glass do you actually stock/take for this group?</label>' +
      '<input type="text" id="baseModelInput" placeholder="e.g. Realme 5" value="' + (existing ? escapeHtml(existing.baseModel || '') : '') + '">' +
      '<p class="form-hint">This is what the search result will tell you to grab.</p>' +
      '<label>Glass / part type (optional)</label>' +
      '<input type="text" id="glassTypeInput" placeholder="e.g. OCA glass only, or Glass + digitizer" value="' + (existing ? escapeHtml(existing.glassType || '') : '') + '">' +
      '<label>Notes (optional)</label>' +
      '<input type="text" id="notesInput" placeholder="e.g. Frame differs, check camera cutout" value="' + (existing ? escapeHtml(existing.notes || '') : '') + '">' +
      '<div class="form-actions">' +
        '<button id="cancelBtn">Cancel</button>' +
        '<button class="btn-accent" id="saveBtn">' + (existing ? 'Save changes' : 'Add group') + '</button>' +
      '</div>' +
    '</div>';
  document.getElementById('cancelBtn').onclick = hideForm;
  document.getElementById('saveBtn').onclick = submitForm;
  panel.scrollIntoView({behavior:'smooth', block:'center'});
  document.getElementById('modelsInput').focus();
}

function hideForm(){
  editingId = null;
  document.getElementById('formPanel').innerHTML = '';
}

function submitForm(){
  const raw = document.getElementById('modelsInput').value;
  const models = raw.split(',').map(s => s.trim()).filter(Boolean);
  if(models.length < 2){
    toast('Add at least two models that share this glass');
    return;
  }
  let baseModel = document.getElementById('baseModelInput').value.trim();
  if(!baseModel) baseModel = models[0];
  const glassType = document.getElementById('glassTypeInput').value.trim();
  const notes = document.getElementById('notesInput').value.trim();

  if(editingId){
    const g = groups.find(g => g.id === editingId);
    g.models = models;
    g.baseModel = baseModel;
    g.glassType = glassType;
    g.notes = notes;
    toast('Group updated');
  }else{
    groups.push({
      id: 'g_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      models, baseModel, glassType, notes
    });
    toast('Group added');
  }
  saveGroups();
  renderGroupList();
  renderResults();
  hideForm();
}

function startEdit(id){
  const g = groups.find(g => g.id === id);
  if(g) showForm(g);
}

function deleteGroup(id){
  if(!confirm('Delete this compatibility group?')) return;
  groups = groups.filter(g => g.id !== id);
  saveGroups();
  renderGroupList();
  renderResults();
  toast('Group deleted');
}

document.getElementById('addBtn').onclick = () => showForm(null);
document.getElementById('searchInput').addEventListener('input', renderResults);

window.addEventListener('error', function(e){
  const banner = document.createElement('div');
  banner.style.cssText = 'background:#fff;color:#ff5c72;border:3px solid #ff5c72;border-radius:12px;padding:12px 16px;margin-bottom:1rem;font-size:13px;font-weight:600;';
  banner.textContent = 'Something went wrong: ' + e.message;
  document.body.insertBefore(banner, document.body.firstChild);
});

loadGroups();
</script>
